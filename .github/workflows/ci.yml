name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate Stream Deck plugin
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Check Property Inspector JavaScript
        run: node --check com.gabrielzv1233.synapsedeck.sdPlugin/ui/profile.js

      - name: Build
        run: npm run build

      - name: Validate manifest and plugin
        run: npx streamdeck validate --no-update-check com.gabrielzv1233.synapsedeck.sdPlugin

      - name: Compute plugin version
        id: version
        shell: pwsh
        run: |
          $baseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($baseVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "package.json version must use major.minor.patch format. Got: $baseVersion"
          }
          $version = "$baseVersion.${{ github.run_number }}"
          "version=$version" >> $env:GITHUB_OUTPUT
          "Packaging SynapseDeck $version"

      - name: Package plugin
        run: npx streamdeck pack --no-update-check --force --version "${{ steps.version.outputs.version }}" --output dist com.gabrielzv1233.synapsedeck.sdPlugin

      - name: Name versioned installer
        shell: pwsh
        run: |
          $expected = "dist/SynapseDeck-v${{ steps.version.outputs.version }}.streamDeckPlugin"
          $package = Get-ChildItem -Path dist -Filter *.streamDeckPlugin | Select-Object -First 1
          if (-not $package) {
            throw "Stream Deck package was not produced."
          }
          Move-Item -Force $package.FullName $expected
          if (-not (Test-Path $expected)) {
            throw "Expected package not found at $expected"
          }

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/SynapseDeck-v${{ steps.version.outputs.version }}.streamDeckPlugin
          archive: false
          if-no-files-found: error
