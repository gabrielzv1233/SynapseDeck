name: Build Plugin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SynapseDeck plugin
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate manifest and plugin
        run: npx streamdeck validate --no-update-check com.gabrielzv1233.synapsedeck.sdPlugin

      - name: Package plugin
        run: npx streamdeck pack --no-update-check --force --output dist com.gabrielzv1233.synapsedeck.sdPlugin

      - name: Verify package filename
        shell: pwsh
        run: |
          $expected = "dist/com.gabrielzv1233.synapsedeck.streamDeckPlugin"
          $package = Get-ChildItem -Path dist -Filter *.streamDeckPlugin | Select-Object -First 1
          if (-not $package) {
            throw "Stream Deck package was not produced."
          }
          if ($package.FullName -ne (Join-Path $PWD $expected)) {
            Move-Item -Force $package.FullName $expected
          }
          if (-not (Test-Path $expected)) {
            throw "Expected package not found at $expected"
          }

      - name: Upload direct plugin artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: dist/com.gabrielzv1233.synapsedeck.streamDeckPlugin
          archive: false
          if-no-files-found: error

      - name: Add download link to summary
        shell: pwsh
        run: |
          "## SynapseDeck build" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "[Download com.gabrielzv1233.synapsedeck.streamDeckPlugin](${{ steps.upload.outputs.artifact-url }})" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "Uploaded directly as a `.streamDeckPlugin` file with no outer ZIP archive." >> $env:GITHUB_STEP_SUMMARY
